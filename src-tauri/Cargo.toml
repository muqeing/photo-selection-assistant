[package]
name = "app"
version = "0.1.23"
description = "Local-first photo number selection and safe copying"
authors = ["muqeing"]
license = "MIT"
repository = "https://github.com/muqeing/photo-selection-assistant"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
blake3 = "=1.8.2"
base64 = "0.22"
cap-fs-ext = "4.0.2"
cap-primitives = "4.0.2"
cap-std = "4.0.2"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "=1.5.0"
fs2 = "0.4"
# Clipboard's arboard dependency permits newer image releases that require
# edition 2024. Keep the desktop build parseable and compilable on Rust 1.77.
image = { version = "=0.25.5", default-features = false, features = ["jpeg", "png", "webp"] }
# image 0.25.5 permits newer image-webp releases requiring Rust 1.80.
# Keep the declared Rust 1.77.2 desktop toolchain supported.
image-webp = "=0.2.0"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
thiserror = "2"
tokio = { version = "=1.53.1", features = ["rt", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

# Keyring 3 has no default credential store. Keep native stores explicit so
# supported desktop builds cannot silently use the in-memory mock store.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
# keyring permits security-framework 3.x; pin a Rust 1.77-compatible release.
security-framework = "=3.6.0"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_NetworkManagement_WNet",
] }

[dev-dependencies]
tempfile = "3"
httpmock = "=0.7.0"
